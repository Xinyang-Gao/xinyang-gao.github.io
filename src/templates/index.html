<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="高新炀的个人网站 - 学生、开发者、写作者，用代码和文字探索世界">

  <link rel="canonical" href="{{SITE_URL}}/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="高新炀的小站">
  <meta property="og:title" content="高新炀 · 个人网站">
  <meta property="og:description" content="高新炀的个人网站 - 学生、开发者、写作者，用代码和文字探索世界">
  <meta property="og:url" content="{{SITE_URL}}/">
  <meta property="og:image" content="{{SITE_URL}}/assets/avatar.webp">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="高新炀 · 个人网站">
  <meta name="twitter:description" content="高新炀的个人网站 - 学生、开发者、写作者，用代码和文字探索世界">
  <meta name="twitter:image" content="{{SITE_URL}}/assets/avatar.webp">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="alternate" type="application/rss+xml" title="高新炀的小站 RSS" href="{{SITE_URL}}/rss.xml">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"高新炀的小站","url":"{{SITE_URL}}/","inLanguage":"zh-CN","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"{{SITE_URL}}/articles/?q={search_term_string}"},"query-input":"required name=search_term_string"}}</script>
  <noscript><style>#loading-overlay{display:none!important}</style></noscript>
  <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="preconnect" href="https://uapis.cn" crossorigin>
  <link rel="stylesheet" href="/css/core.css">
  <link rel="stylesheet" href="/css/components/loading-overlay.css">
  <link rel="stylesheet" href="/css/components/tooltip.css">
  <link rel="stylesheet" href="/css/pages/home.css">
  <script src="https://kit.fontawesome.com/a3c3c05703.js" crossorigin="anonymous" defer></script>
</head>

<body>

  <div id="loading-overlay" role="status" aria-label="页面加载中">
    <div class="loading-glow"></div>
    <div id="loading-content">
      <span class="loading-title">GaoXinYang</span>
    </div>
  </div>

  <noscript>
    <div
      style="background: #ab4f57; color: white; text-align: center; padding: 12px 16px; font-size: 0.9rem; position: sticky; top: 0; z-index: 1000001;">
      诶呀！您的浏览器似乎未启用 JavaScript。<br>不过别担心，我们提供无需 JS 即可访问全部内容的静态镜像页面，请移步：
      <a href="/nojs.html" style="color: white; font-weight: bold; text-decoration: underline;">静态镜像版 /nojs.html</a>
      以获得更好的体验 。
    </div>
  </noscript>

  <div id="navbar-placeholder"></div>

  <div id="router-view">
    <div class="two-column-layout">
      <aside class="sidebar-profile">
        <div id="personal-card-container"></div>
      </aside>

      <main class="main-content-area">
        <div class="container">
          <section class="home-hero">
            <div class="hero-meta">
              <span class="hero-path">~/gaoxinyang · personal site</span>
              <span class="hero-clock">
                <i class="live-dot" aria-hidden="true"></i>
                <!-- 装饰性实时时钟：不进无障碍树，避免读屏每秒播报 -->
                <span id="live-clock" aria-hidden="true">--:--:--</span>
              </span>
            </div>

            <p class="hero-greeting" id="dynamic-greeting">你好</p>

            <h1 class="hero-name">
              Gao<span class="hero-name-dot">·</span>XinYang
              <span class="hero-seal" aria-hidden="true">G</span>
            </h1>

            <p class="hero-copy">
              谢谢你在茫茫互联网世界中找到我。<br />
              这里写文章、做作品，也记录思考的吉光片羽。
            </p>

            <div class="hero-actions">
              <a href="#blogHome" class="hero-btn hero-btn--solid">进入首页 <i class="fas fa-arrow-down"></i></a>
              <a href="/about/" class="hero-btn hero-btn--line">了解我</a>
            </div>

            <a href="#blogHome" class="hero-scroll-hint">
              <span>继续下滑，进入博客</span>
              <i class="fas fa-chevron-down"></i>
            </a>
          </section>

          <!-- 曾是第二个 <main>（嵌套 main 属 HTML 非法），降级为 section -->
          <section class="home-main" id="blogHome">

            <section class="home-section reveal">
              <header class="section-head">
                <span class="section-index">01</span>
                <h2 class="section-title">最新文章与作品</h2>
                <span class="section-rule" aria-hidden="true"></span>
                <span class="section-badge" id="statsUpdateBadge"></span>
              </header>
              <p class="section-sub">这里有最新文章、作品与主题标签。每次下滑，都是一段新的文字旅程。</p>
              <div class="stats-strip" id="statsContainer" aria-live="polite">
                <div class="stats-loading"><i class="fas fa-circle-notch fa-spin"></i>加载中…</div>
              </div>
            </section>

            <section class="home-section reveal">
              <header class="section-head">
                <span class="section-index">02</span>
                <h2 class="section-title">按标签漫游</h2>
                <span class="section-rule" aria-hidden="true"></span>
              </header>
              <div class="tags-grid">
                <div class="tags-block">
                  <h3 class="tags-block-title"><i class="fas fa-hashtag"></i>文章星系</h3>
                  <div class="tags-list" id="articleTagsList"><span class="tag">加载中…</span></div>
                </div>
                <div class="tags-block tags-block--side">
                  <h3 class="tags-block-title"><i class="fas fa-flask"></i>创意工坊</h3>
                  <div class="tags-list" id="workTagsList"><span class="tag">加载中…</span></div>
                </div>
              </div>
            </section>

            <section class="home-section home-section--quote reveal">
              <blockquote class="inspire-quote">
                <i class="fas fa-quote-left quote-mark" aria-hidden="true"></i>
                <p class="quote-text">正在拾取一句来自星海的话…</p>
                <cite class="inspire-author">佚名</cite>
                <span class="inspire-source">加载中</span>
              </blockquote>
              <button class="quote-refresh" id="quoteRefresh" type="button" title="换一句" aria-label="换一句">
                <i class="fas fa-sync-alt" aria-hidden="true"></i>
              </button>
            </section>

            <nav class="quick-site-nav reveal" aria-label="全站快捷导航">
              <div class="quick-nav-links">
                <a href="/">首页</a><a href="/about/">关于</a><a href="/articles/">文章</a>
                <a href="/timeline/">时间线</a><a href="/works/">作品</a><a href="/friends/">友链</a><a href="/contact/">留言板</a>
              </div>
            </nav>
          </section>
        </div>
      </main>
    </div>
  </div>


  <div id="pageTransition" class="page-transition"></div>

  <script src="/js/vendor/vercount.min.js" defer></script>
  <script src="/js/entry/main.js" type="module"></script>
  <div id="footer-placeholder"></div>
</body>

</html>
