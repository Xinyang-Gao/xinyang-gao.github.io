<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="页面未找到 - 高新炀的小站">
  <title>404 · 高新炀的小站</title>
  <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="stylesheet" href="/css/core/variables.css">
  <link rel="stylesheet" href="/css/core/base.css">
  <link rel="stylesheet" href="/css/core/layout.css">
  <link rel="stylesheet" href="/css/core/components.css">
  <link rel="stylesheet" href="/css/components/loading-overlay.css">
  <link rel="stylesheet" href="/css/components/tooltip.css">
  <link rel="stylesheet" href="/css/pages/404.css">
  <script src="https://kit.fontawesome.com/a3c3c05703.js" crossorigin="anonymous" defer></script>
</head>
<body>
  <div id="loading-overlay" role="status" aria-label="页面加载中">
    <div class="loading-glow"></div>
    <div id="loading-content">
      <span class="loading-title">GaoXinYang</span>
    </div>
  </div>

  <div id="navbar-placeholder"></div>

  <div id="router-view">
    <main class="container error-container">
      <div class="error-content">
        <div class="error-background-code" aria-hidden="true">404</div>

        <div class="error-main">
          <h1 class="error-headline" id="errorTitle">页面未找到</h1>
          <p class="error-subtext" id="errorMessage">您访问的地址可能已变更或不存在</p>

          <div class="error-path-row">
            <i class="fas fa-link" aria-hidden="true"></i>
            <span id="errorPathDisplay" class="error-path-badge">—</span>
          </div>

          <div class="error-buttons-group">
            <button id="goBackBtn" class="button button-secondary" type="button">
              <i class="fas fa-arrow-left" aria-hidden="true"></i>返回上一页
            </button>
            <a href="/" class="button button-primary">
              <i class="fas fa-home" aria-hidden="true"></i>返回首页
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="pageTransition" class="page-transition"></div>
  <div id="footer-placeholder"></div>

  <script src="/js/vendor/vercount.min.js" defer></script>
  <script src="/js/entry/main.js" type="module"></script>
  <script src="/js/pages/404.js" type="module"></script>
</body>
</html>
