<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="时间线 - 按时间顺序浏览高新炀的小站的文章、作品与生活记录，回望一路走来的足迹。" />
    <title>时间线 - 高新炀的小站</title>
    <link rel="canonical" href="{{SITE_URL}}/timeline/" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="高新炀的小站">
    <meta property="og:title" content="时间线 - 高新炀的小站">
    <meta property="og:description" content="按时间顺序浏览文章、作品与生活记录，回望一路走来的足迹。">
    <meta property="og:url" content="{{SITE_URL}}/timeline/">
    <meta property="og:image" content="{{SITE_URL}}/assets/avatar.webp">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="时间线 - 高新炀的小站">
    <meta name="twitter:description" content="按时间顺序浏览文章、作品与生活记录，回望一路走来的足迹。">
    <meta name="twitter:image" content="{{SITE_URL}}/assets/avatar.webp">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="alternate" type="application/rss+xml" title="高新炀的小站 RSS" href="{{SITE_URL}}/rss.xml" />
    <noscript><style>#loading-overlay{display:none!important}</style></noscript>
    <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
    <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
    <link rel="stylesheet" href="/css/core.css" />
    <link rel="stylesheet" href="/css/components/loading-overlay.css" />
    <link rel="stylesheet" href="/css/components/tooltip.css" />
    <link rel="stylesheet" href="/css/pages/timeline.css" />
    <script src="https://kit.fontawesome.com/a3c3c05703.js" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>

<body>
    <div id="loading-overlay" role="status" aria-label="页面加载中">
        <div class="loading-glow"></div>
        <div id="loading-content"><span class="loading-title">GaoXinYang</span></div>
    </div>

    <div id="navbar-placeholder"></div>

    <div id="router-view">
        <div class="two-column-layout">
            <aside class="sidebar-profile">
                <div id="personal-card-container"></div>
            </aside>

            <main class="main-content-area">
                <div class="container">
                    <h2>时间线</h2>
                    <p>按时间顺序浏览本站发布的文章、作品与版本更新。</p>

                    <div class="timeline-toolbar">
                        <div class="timeline-toolbar-left">
                            <label for="timeline-year-filter">按年份筛选：</label>
                            <select id="timeline-year-filter">
                                <option value="all">全部年份</option>
                            </select>
                            <span class="filter-separator">|</span>
                            <span class="type-filter-group">
                                <label><input type="checkbox" class="type-filter" value="article" checked> 文章</label>
                                <label><input type="checkbox" class="type-filter" value="work" checked> 作品</label>
                                <label><input type="checkbox" class="type-filter" value="version" checked> 更新日志</label>
                            </span>
                        </div>
                        <div class="timeline-toolbar-right">
                            <input type="text" id="timeline-search" placeholder="搜索标题、描述、标签…" />
                            <button id="timeline-reset" type="button" class="btn-secondary">重置</button>
                        </div>
                    </div>

                    <div id="year-capsules-container" class="year-capsules-wrapper"></div>

                    <div id="timeline-summary" class="timeline-summary"></div>

                    <div id="timeline-container" class="timeline-container"></div>
                </div>
            </main>
        </div>
    </div>

    <div id="pageTransition" class="page-transition"></div>

    <div id="footer-placeholder"></div>

    <script src="/js/vendor/vercount.min.js" defer></script>
    <script src="/js/entry/main.js" type="module"></script>
    <script type="module" src="/js/pages/timeline.js"></script>
</body>
</html>
