name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------- 1. 构建（产物作为 artifact 传给部署作业） ----------
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 无需完整历史：仅需工作树 + works 子模块内容
          fetch-depth: 1
          submodules: 'recursive'

      # ---------- Python（内容与聚合生成） ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ---------- Node.js（前端 TypeScript 编译） ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci

      # ---------- 构建 ----------
      # 说明：CI 每次都是全新检出，不存在 .build_state.json，天然等价于全量构建，
      #       因此不需要 --force（它会强制重新抓取全部友链头像，拖慢且增加失败率）。
      #       --ci 开启严格模式：前端编译失败即让工作流失败，避免部署半成品。
      - name: Build site
        run: python run.py --ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ---------- 2. 部署 ----------
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
