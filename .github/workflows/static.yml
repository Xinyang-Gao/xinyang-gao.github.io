name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR 只构建不部署；同分支的 push 继续走完整部署
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------- 1. 构建（产物作为 artifact 传给部署作业） ----------
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 无需完整历史：仅需工作树 + works 子模块内容
          fetch-depth: 1
          submodules: 'recursive'

      # ---------- Python（内容与聚合生成） ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ---------- Node.js（前端 TypeScript 编译） ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci

      # ---------- 质量门禁：静态检查（在构建前快速失败） ----------
      # ruff 配置已随 pyproject.toml 入库；typecheck 是 TypeScript 唯一的
      # 类型校验（Vite 只转译不检查）
      - name: Lint Python (ruff)
        run: |
          python -m pip install ruff
          ruff check builder run.py
      - name: Typecheck TypeScript
        run: npm run typecheck
      - name: Lint TypeScript (biome)
        run: npm run lint

      # ---------- 友链主题色缓存 ----------
      # src/assets/friend_colors.json 是随仓库提交的持久化缓存：只要能读到，
      # CI 就只给新增友链抓头像，既避免重复网络请求，也不会因个别站点访问
      # 不稳定而抖动（抓取失败时会保留历史颜色）。缺失即快速失败，避免静默
      # 退化成“每次全量抓取”。
      - name: 校验友链主题色缓存
        run: |
          test -s src/assets/friend_colors.json || {
            echo "::error::src/assets/friend_colors.json 缺失或为空，构建将重新抓取全部友链头像"
            exit 1
          }
          python -c "import json;d=json.load(open('src/assets/friend_colors.json',encoding='utf-8'));print(f'友链主题色缓存可用：{len(d)} 条（仅新增友链需要联网）')"

      # 头像字节缓存：与主题色缓存互补，跨运行复用已下载的头像
      - name: Restore avatar cache
        uses: actions/cache@v4
        with:
          path: .cache/friend-avatars
          key: friend-avatars-${{ hashFiles('src/assets/friends.json') }}
          restore-keys: |
            friend-avatars-

      # ---------- 构建 ----------
      # 说明：CI 每次都是全新检出，不存在 .build_state.json，天然等价于全量构建，
      #       因此不需要 --force（它会强制重新抓取全部友链头像，拖慢且增加失败率）。
      #       --ci 开启严格模式：前端编译失败即让工作流失败，避免部署半成品。
      - name: Build site
        run: python run.py --ci
        env:
          # 与上面的 actions/cache 步骤配套：复用已下载的头像字节
          FRIEND_AVATAR_CACHE_DIR: ${{ github.workspace }}/.cache/friend-avatars

      # ---------- 质量门禁：产物冒烟检查 ----------
      # 关键产物缺失（生成器静默失败、增量误判）时拒绝部署半成品
      - name: Smoke check dist
        run: |
          set -euo pipefail
          required=(
            dist/index.html
            dist/404.html
            dist/nojs.html
            dist/offline.html
            dist/robots.txt
            dist/rss.xml
            dist/sitemap.xml
            dist/favicon.ico
            dist/articles/index.html
            dist/works/index.html
            dist/friends/index.html
            dist/json/articles.json
            dist/json/works.json
            dist/json/statistics.json
            dist/js/entry/main.js
            dist/css/core/base.css
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::产物缺失或为空: $f"
              missing=1
            fi
          done
          # robots 的 Sitemap 行必须是绝对地址
          grep -q '^Sitemap: https://' dist/robots.txt \
            || { echo "::error::robots.txt 缺少绝对 Sitemap 地址"; missing=1; }
          # sitemap 不得包含已知 404 页面
          if grep -q '/settings/' dist/sitemap.xml; then
            echo "::error::sitemap 包含不存在的 /settings/"
            missing=1
          fi
          # 分享卡片必须存在（index 的 head 不能是空的）
          grep -q 'property="og:title"' dist/index.html \
            || { echo "::error::index.html 缺少 OG 标签"; missing=1; }
          grep -q 'rel="canonical"' dist/index.html \
            || { echo "::error::index.html 缺少 canonical"; missing=1; }
          # favicon 不得回退到未压缩的大文件（205KB 事故回归保护）
          fav_size=$(stat -c %s dist/favicon.ico)
          if [ "$fav_size" -gt 50000 ]; then
            echo "::error::favicon.ico 过大 (${fav_size}B)，疑似未压缩"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "冒烟检查通过"
          exit "$missing"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ---------- 2. 部署 ----------
  deploy:
    name: Deploy to Pages
    # PR 只验证不部署
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
